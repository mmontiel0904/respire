name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  daemon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: respired
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          for f in extension/*.js; do
            node --input-type=module --check < "$f"
          done
      - name: History tests
        run: node --experimental-detect-module tools/history-test.mjs
      - name: Validate metadata.json
        run: jq -e '.uuid and .name and .["shell-version"]' extension/metadata.json
